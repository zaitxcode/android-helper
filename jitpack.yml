# JitPack build configuration.
#
# To make the build independent of the wrapper jar, Gradle is installed and
# activated through SDKMAN and invoked directly.

before_install:
  - sdk install java 21.0.2-open || true
  - sdk install gradle 9.6.0 || true

install:
  - . "${SDKMAN_DIR:-$HOME/.sdkman}/bin/sdkman-init.sh" && sdk use java 21.0.2-open && sdk use gradle 9.6.0 && gradle -Pgroup=${GROUP:-com.zaitxcode} -Pversion=${VERSION:-1.0.0-RC01} --no-daemon -xlint -xlintVitalRelease -xlintVitalAnalyzeRelease :library:publishToMavenLocal

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.parallel=true -Dkotlin.daemon.jvmargs=-Xmx1g"

artifacts:
  - path: library/build/outputs/aar/library-release.aar
    type: aar
